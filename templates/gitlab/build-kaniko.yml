# ============================================================================
# Kaniko Build Template for GitLab CI
# ============================================================================
#
# Usage in your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/rhincodon-studio/public-devops-templates/main/templates/gitlab/build-kaniko.yml'
#
#   variables:
#     CONTAINER_REPOSITORY: "myorg/myimage"
#     DOCKERFILE_PATH: "Dockerfile"
#     REGISTRY: "ghcr"  # or "dockerhub"
#
#   build:
#     extends: .kaniko-build
#
# Required CI/CD Variables (Settings > CI/CD > Variables):
#   - GHCR_USERNAME / GHCR_TOKEN (for ghcr registry)
#   - DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (for dockerhub registry)
#
# ============================================================================

.kaniko-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  variables:
    # Override these in your pipeline
    CONTAINER_REPOSITORY: ""
    DOCKERFILE_PATH: "Dockerfile"
    WORKING_DIRECTORY: "."
    REGISTRY: "ghcr"  # ghcr or dockerhub
    CACHE_ENABLED: "true"
    VERSION: ""
  before_script:
    # Generate version tag (8 chars to match GitHub Actions)
    - |
      if [ -n "${VERSION}" ]; then
        export BUILD_VERSION="${VERSION}"
      else
        export BUILD_VERSION="$(date '+%Y-%m-%d').${CI_COMMIT_SHA:0:8}"
      fi
      echo "BUILD_VERSION=${BUILD_VERSION}"

    # Set registry URL
    - |
      if [ "${REGISTRY}" = "ghcr" ]; then
        export REGISTRY_URL="ghcr.io"
        export REGISTRY_USER="${GHCR_USERNAME}"
        export REGISTRY_PASS="${GHCR_TOKEN}"
      else
        export REGISTRY_URL="docker.io"
        export REGISTRY_USER="${DOCKERHUB_USERNAME}"
        export REGISTRY_PASS="${DOCKERHUB_TOKEN}"
      fi

    # Configure Docker auth for Kaniko
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(echo -n "${REGISTRY_USER}:${REGISTRY_PASS}" | base64)
      if [ "${REGISTRY}" = "ghcr" ]; then
        echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
      else
        echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
      fi

  script:
    # Build cache arguments
    - |
      CACHE_ARGS=""
      if [ "${CACHE_ENABLED}" = "true" ]; then
        CACHE_REPO="${REGISTRY_URL}/${CONTAINER_REPOSITORY}/cache"
        CACHE_ARGS="--cache=true --cache-repo=${CACHE_REPO}"
      fi

    # Run Kaniko build
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/${WORKING_DIRECTORY}" \
        --dockerfile "${CI_PROJECT_DIR}/${WORKING_DIRECTORY}/${DOCKERFILE_PATH}" \
        --destination "${REGISTRY_URL}/${CONTAINER_REPOSITORY}:${BUILD_VERSION}" \
        ${CACHE_ARGS} \
        --image-fs-extract-retry 5

    # Export version for downstream jobs
    - echo "VERSION=${BUILD_VERSION}" > build.env

  artifacts:
    reports:
      dotenv: build.env
