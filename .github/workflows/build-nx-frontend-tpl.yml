# ============================================================================
# Nx Frontend Build + Deploy Template
# ============================================================================
#
# 📋 功能說明：
#   - 整合 build-kaniko-nx-tpl（Runner 預建置 + Kaniko 打包）
#   - 整合 deploy-update-tag-kubernetes-tpl（自動更新 rs-manifest image tag）
#   - 單一 template 涵蓋 Nx monorepo 前端 app 完整 CI/CD 流程
#
# 🔧 使用方式：
#
#   .github/workflows/build-my-app.yaml:
#
#   name: Build my-app
#   on:
#     push:
#       branches: [main]
#       tags: ['v*']
#       paths:
#         - 'apps/my-app/**'
#         - 'libs/**'
#         - 'package.json'
#         - 'package-lock.json'
#     workflow_dispatch:
#       inputs:
#         deploy:
#           description: 'Deploy after build'
#           type: boolean
#           default: true
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
#   jobs:
#     build-deploy:
#       uses: rhincodon-studio/public-devops-templates/.github/workflows/build-nx-frontend-tpl.yml@main
#       permissions:
#         contents: read
#         packages: write
#       with:
#         app_name: my-app
#         container_org: myorg
#         deploy_app: my-app
#         deploy_namespace: my-app
#         deploy: ${{ github.event.inputs.deploy != 'false' }}
#       secrets: inherit
#
# 📦 輸入參數（必填）：
#   - app_name:          Nx project name，也用於 dockerfile/dist 路徑（e.g. agentbcd）
#   - container_org:     Container image org（e.g. hanklinstudio）
#   - deploy_app:        rs-manifest 中的 app 名稱（e.g. dockci）
#   - deploy_namespace:  K8s namespace（e.g. dockci）
#
# 📦 輸入參數（選填）：
#   - cluster:           K8s cluster name（預設 RKE2-TWTPH-LAB）
#   - tag_yaml_path:     values.yaml 中 image tag 路徑（預設 frontend.image.tag）
#   - node_version:      Node.js 版本（預設 22）
#   - deploy:            是否在 build 後部署（預設 true）
#
# 🔐 必要 Secrets（透過 secrets: inherit 傳入）：
#   - GIT_TOKEN: repo write 權限的 PAT（deploy job 更新 rs-manifest 用）
#
# 📤 輸出：
#   - version: 產生的 image tag（YYYY-MM-DD.commit-sha）
#
# ============================================================================

name: 🏗️ Nx Frontend Build + Deploy Template

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Nx project name and app directory (e.g. agentbcd, dobersoc)'
        required: true
        type: string
      container_org:
        description: 'Container registry org (e.g. hanklinstudio)'
        required: true
        type: string
      deploy_app:
        description: 'App name in rs-manifest (e.g. dockci, doberman-agent)'
        required: true
        type: string
      deploy_namespace:
        description: 'Kubernetes namespace (e.g. dockci, doberman-agent)'
        required: true
        type: string
      cluster:
        description: 'Target cluster name'
        required: false
        type: string
        default: 'RKE2-TWTPH-LAB'
      tag_yaml_path:
        description: 'YAML path for image tag in values.yaml'
        required: false
        type: string
        default: 'frontend.image.tag'
      node_version:
        description: 'Node.js version for nx build'
        required: false
        type: string
        default: '22'
      deploy:
        description: 'Run deploy job after build'
        required: false
        type: boolean
        default: true
    secrets:
      GIT_TOKEN:
        required: false
    outputs:
      version:
        description: 'Generated image tag'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    uses: rhincodon-studio/public-devops-templates/.github/workflows/build-kaniko-nx-tpl.yml@v1.5.0
    permissions:
      contents: read
      packages: write
    with:
      container_repository: ${{ inputs.container_org }}/${{ inputs.app_name }}
      dockerfile_path: apps/${{ inputs.app_name }}/Dockerfile
      pre_build_command: npx nx build ${{ inputs.app_name }} --prod
      node_version: ${{ inputs.node_version }}
      registry: ghcr
      cache_repository: ghcr.io/${{ inputs.container_org }}/kaniko-cache/${{ inputs.app_name }}
    secrets: inherit

  deploy:
    needs: build
    if: >
      inputs.deploy &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    uses: rhincodon-studio/public-devops-templates/.github/workflows/deploy-update-tag-kubernetes-tpl.yml@main
    with:
      app: ${{ inputs.deploy_app }}
      cluster: ${{ inputs.cluster }}
      namespace: ${{ inputs.deploy_namespace }}
      image_tag: ${{ needs.build.outputs.version }}
      tag_yaml_path: ${{ inputs.tag_yaml_path }}
      triggered_by: ${{ github.event_name }}
      commit_sha: ${{ github.sha }}
    secrets:
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
