# ============================================================================
# Kaniko Build Template for Java (Maven — Pre-build on Runner)
# ============================================================================
#
# 📋 功能說明：
#   - 在 Runner 上執行 Maven 建置，再用 Kaniko 包裝產物（JAR/WAR）
#   - ~/.m2/repository 透過 actions/cache 跨 run 復用，加速依賴下載
#   - kaniko context 為 workspace 根目錄（支援 multi-module Maven project）
#   - --snapshot-mode=redo 減少 kaniko layer diff 開銷
#   - 支援推送至 GHCR 或 DockerHub
#
# 🔧 使用方式：
#
#   📌 Spring Boot fat JAR：
#   jobs:
#     build:
#       uses: rhincodon-studio/public-devops-templates/.github/workflows/build-kaniko-java-tpl.yml@main
#       permissions:
#         contents: read
#         packages: write
#       with:
#         container_repository: "myorg/my-service"
#         dockerfile_path: "Dockerfile"
#         registry: "ghcr"
#       secrets: inherit
#
#   📌 Multi-module（指定子模組）：
#   jobs:
#     build:
#       uses: rhincodon-studio/public-devops-templates/.github/workflows/build-kaniko-java-tpl.yml@main
#       permissions:
#         contents: read
#         packages: write
#       with:
#         container_repository: "myorg/my-service"
#         dockerfile_path: "apps/my-service/Dockerfile"
#         maven_goals: "package -DskipTests -pl apps/my-service -am"
#         registry: "ghcr"
#       secrets: inherit
#
#   📌 Dockerfile 建議格式（Runner 已建置好 JAR）：
#     FROM eclipse-temurin:21-jre-alpine
#     COPY apps/my-service/target/*.jar /app/app.jar
#     EXPOSE 8080
#     ENTRYPOINT ["java", "-jar", "/app/app.jar"]
#
# ============================================================================

name: 🔧 Kaniko Build Template (Java)

on:
  workflow_call:
    inputs:
      container_repository:
        description: 'Container repository path (e.g. myorg/myimage)'
        required: true
        type: string
      dockerfile_path:
        description: 'Dockerfile path relative to workspace root'
        required: true
        type: string
      java_version:
        description: 'JDK version'
        required: false
        type: string
        default: '21'
      java_distribution:
        description: 'JDK distribution (temurin, corretto, zulu, etc.)'
        required: false
        type: string
        default: 'temurin'
      maven_goals:
        description: 'Maven goals to execute (e.g. "package -DskipTests -pl apps/my-service -am")'
        required: false
        type: string
        default: 'package -DskipTests'
      maven_opts:
        description: 'MAVEN_OPTS env var (e.g. "-Xmx1024m")'
        required: false
        type: string
        default: '-Xmx1024m'
      working_directory:
        description: 'Working directory for Maven build (default: repo root)'
        required: false
        type: string
        default: '.'
      snapshot_mode:
        description: 'Kaniko snapshot mode (redo / time / full)'
        required: false
        type: string
        default: 'redo'
      registry:
        description: 'Target container registry: ghcr or dockerhub'
        required: false
        type: string
        default: 'ghcr'
      cache:
        description: 'Enable kaniko layer caching'
        required: false
        type: boolean
        default: true
      cache_repository:
        description: 'Remote kaniko cache repository (default: auto-generated)'
        required: false
        type: string
        default: ''
      private_registry:
        description: 'Optional private registry hostname for auth injection'
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Runner label'
        required: false
        type: string
        default: 'arc-runner-set-hank'
      version:
        description: 'Override version tag; if empty, auto-generates date.commit'
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 30
      build_args:
        description: 'Extra kaniko --build-arg flags (space-separated KEY=VALUE)'
        required: false
        type: string
        default: ''
      kaniko_image:
        description: 'Kaniko executor image'
        required: false
        type: string
        default: 'gcr.io/kaniko-project/executor:v1.23.0-debug'
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      GHCR_TOKEN:
        required: false
      PRIVATE_REGISTRY_USERNAME:
        required: false
      PRIVATE_REGISTRY_PASSWORD:
        required: false
    outputs:
      version:
        description: 'Generated version tag (YYYY-MM-DD.commit-sha)'
        value: ${{ jobs.kaniko-build.outputs.version }}

jobs:
  kaniko-build:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # --- JDK Setup ---
      - name: Setup JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}

      # --- Maven dependency cache ---
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # --- Maven build ---
      - name: Build with Maven
        working-directory: ${{ inputs.working_directory }}
        env:
          MAVEN_OPTS: ${{ inputs.maven_opts }}
        run: mvn -B ${{ inputs.maven_goals }}

      # --- Docker Auth ---
      - name: Configure Docker Auth (GHCR)
        if: inputs.registry == 'ghcr'
        env:
          GHCR_PASS: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          DOCKER_CFG_DIR="${RUNNER_TEMP}/.docker"
          mkdir -p "${DOCKER_CFG_DIR}"
          echo '{"auths":{"ghcr.io":{"auth":"'"$(echo -n ${{ github.actor }}:${GHCR_PASS} | base64)"'"}}}' \
            > "${DOCKER_CFG_DIR}/config.json"
          echo "DOCKER_CFG_DIR=${DOCKER_CFG_DIR}" >> $GITHUB_ENV

      - name: Configure Docker Auth (DockerHub)
        if: inputs.registry == 'dockerhub'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          DOCKER_CFG_DIR="${RUNNER_TEMP}/.docker"
          mkdir -p "${DOCKER_CFG_DIR}"
          AUTH=$(echo -n "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" | base64)
          echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${AUTH}\"}}}" \
            > "${DOCKER_CFG_DIR}/config.json"
          echo "DOCKER_CFG_DIR=${DOCKER_CFG_DIR}" >> $GITHUB_ENV

      - name: Configure Private Registry Auth
        if: inputs.private_registry != ''
        env:
          PRIVATE_REGISTRY: ${{ inputs.private_registry }}
          PRIVATE_REGISTRY_USERNAME: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          PRIVATE_REGISTRY_PASSWORD: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
        run: |
          if [ -z "${PRIVATE_REGISTRY_USERNAME}" ] || [ -z "${PRIVATE_REGISTRY_PASSWORD}" ]; then
            echo "::warning::PRIVATE_REGISTRY_USERNAME or PRIVATE_REGISTRY_PASSWORD not set; skipping"
            exit 0
          fi
          REGISTRY_AUTH=$(echo -n "${PRIVATE_REGISTRY_USERNAME}:${PRIVATE_REGISTRY_PASSWORD}" | base64)
          jq --arg r "${PRIVATE_REGISTRY}" --arg a "${REGISTRY_AUTH}" \
             '.auths[$r] = {"auth": $a}' \
             "${DOCKER_CFG_DIR}/config.json" > /tmp/_priv_cfg.json \
          && mv /tmp/_priv_cfg.json "${DOCKER_CFG_DIR}/config.json"

      # --- Version ---
      - name: Generate Version Tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(date '+%Y-%m-%d').${GITHUB_SHA::8}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Clean up Docker
        run: |
          docker container prune -f || true
          docker image prune -f || true

      # --- Registry + Cache URL ---
      - name: Set Registry and Cache URL
        run: |
          if [ "${{ inputs.registry }}" == "ghcr" ]; then
            REGISTRY_URL="ghcr.io"
          else
            REGISTRY_URL="docker.io"
          fi
          echo "REGISTRY_URL=${REGISTRY_URL}" >> $GITHUB_ENV

          if [ "${{ inputs.cache }}" == "true" ]; then
            if [ -n "${{ inputs.cache_repository }}" ]; then
              echo "CACHE_REPO=${{ inputs.cache_repository }}" >> $GITHUB_ENV
            else
              echo "CACHE_REPO=${REGISTRY_URL}/${{ inputs.container_repository }}/cache" >> $GITHUB_ENV
            fi
          fi

      # --- Kaniko Build & Push ---
      - name: Build and Push with Kaniko
        run: |
          CACHE_ARGS=""
          if [ "${{ inputs.cache }}" == "true" ]; then
            CACHE_ARGS="--cache=true --cache-repo=${CACHE_REPO}"
          fi

          BUILD_ARGS=""
          if [ -n "${{ inputs.build_args }}" ]; then
            for arg in ${{ inputs.build_args }}; do
              BUILD_ARGS="${BUILD_ARGS} --build-arg ${arg}"
            done
          fi

          docker run --network=host \
            -v "$(pwd)":/workspace \
            -v "${DOCKER_CFG_DIR}":/kaniko/.docker:ro \
            ${{ inputs.kaniko_image }} \
            --context /workspace \
            --dockerfile /workspace/${{ inputs.dockerfile_path }} \
            --destination ${REGISTRY_URL}/${{ inputs.container_repository }}:${VERSION} \
            --snapshot-mode=${{ inputs.snapshot_mode }} \
            --build-arg BUILD_COMMIT_SHA=${GITHUB_SHA::8} \
            ${BUILD_ARGS} \
            ${CACHE_ARGS} \
            --image-fs-extract-retry 5
