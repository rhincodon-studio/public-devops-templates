# ============================================================================
# Sonar Universal Scan Template
# ============================================================================
# 
# 📋 功能說明：
#   - 支援 SonarCloud 和自架 SonarQube 兩種模式
#   - 進行程式碼品質與安全性分析
#   - 產生 SARIF 格式報告並上傳為 artifact
#
# 🔧 使用方式（SonarCloud）：
#   jobs:
#     code-quality:
#       uses: ./.github/workflows/scan-sonar-tpl.yml
#       with:
#         mode: "cloud"
#         project-key: "my-project-key"
#         project-name: "My Project"
#         organization: "my-org"
#       secrets:
#         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#
# 🔧 使用方式（Self-hosted SonarQube）：
#   jobs:
#     code-quality:
#       uses: ./.github/workflows/scan-sonar-tpl.yml
#       with:
#         mode: "selfhosted"
#         project-key: "my-project-key"
#         project-name: "My Project"
#       secrets:
#         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
#
# 📦 輸入參數：
#   - mode: 掃描模式，cloud 或 selfhosted（必填）
#   - project-key: Sonar 專案金鑰（必填）
#   - project-name: Sonar 專案名稱（必填）
#   - organization: SonarCloud 組織名稱（cloud 模式必填）
#   - runs_on: Runner 類型（選填，預設：ubuntu-latest）
#
# 🔐 必要 Secrets：
#   - SONAR_TOKEN: Sonar 存取權杖
#   - SONAR_HOST_URL: SonarQube 伺服器網址（selfhosted 模式必填）
#
# ============================================================================

name: Sonar Universal Scan (Template)

on:
  workflow_call:
    inputs:
      mode:
        description: "Scan mode: cloud or selfhosted"
        type: string
        required: true

      project-key:
        description: "Sonar project key"
        type: string
        required: true

      project-name:
        description: "Sonar project name"
        type: string
        required: true

      organization:
        description: "SonarCloud organization (required for cloud mode)"
        type: string
        required: false

      runs_on:
        description: "Runner type"
        type: string
        required: false
        default: '"ubuntu-latest"'

    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: false

jobs:
  sonar-scan:
    runs-on: ${{ fromJSON(inputs.runs_on) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===============================================================
      #  Cloud 模式（SonarCloud）
      # ===============================================================
      - name: SonarCloud Scan
        if: ${{ inputs.mode == 'cloud' }}
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
          SONAR_SCANNER_OPTS: >
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.projectName=${{ inputs.project-name }}
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.sarif.filePath=sonar-report.sarif

      # ===============================================================
      #  Self-hosted 模式（自架 SonarQube）
      # ===============================================================
      - name: SonarQube Scan (Self-hosted)
        if: ${{ inputs.mode == 'selfhosted' }}
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_SCANNER_OPTS: >
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.projectName=${{ inputs.project-name }}
            -Dsonar.sarif.filePath=sonar-report.sarif

      # ===============================================================
      #  上傳報告 artifact（Cloud 與 Selfhosted 皆適用）
      # ===============================================================
      - name: Upload Sonar SARIF Report
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: sonar-report.sarif
          if-no-files-found: warn