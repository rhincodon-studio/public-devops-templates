# ============================================================================
# Snyk Security Scan Template
# ============================================================================
# 
# 📋 功能說明：
#   - 使用 Snyk 進行依賴套件安全掃描
#   - 支援容器映像掃描（選填）
#   - 檢測已知漏洞並提供修復建議
#
# 🔧 使用方式：
#   jobs:
#     security-scan:
#       uses: ./.github/workflows/scan-snyk-tpl.yml
#       with:
#         image-name: "myorg/myimage:latest"  # 選填
#         org: "my-snyk-org"                  # 選填
#       secrets:
#         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
#
# 📦 輸入參數：
#   - image-name: 容器映像名稱（選填，若提供則執行容器掃描）
#   - org: Snyk 組織 ID（選填）
#   - runs_on: Runner 類型（選填，預設：ubuntu-latest）
#
# 🔐 必要 Secrets：
#   - SNYK_TOKEN: Snyk API 權杖
#
# ============================================================================

name: Snyk Scan (Template)

on:
  workflow_call:
    inputs:
      image-name:
        description: "Container image name for Snyk container scan"
        required: false
        type: string
        default: ""

      org:
        description: "Snyk organization ID"
        required: false
        type: string
        default: ""

      runs_on:
        description: "Runner type"
        type: string
        required: false
        default: '"ubuntu-latest"'
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 3

    secrets:
      SNYK_TOKEN:
        required: true

jobs:
  deps-scan:
    name: Snyk Dependency Scan
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Snyk CLI
        uses: snyk/actions/setup@v4

      - name: Snyk Test (Dependencies)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --all-projects \
            ${{ inputs.org && format('--org={0}', inputs.org) || '' }}

  image-scan:
    name: Snyk Container Scan
    if: inputs.image-name != ''
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Install Snyk CLI
        uses: snyk/actions/setup@v4

      - name: Snyk Container Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test \
            ${{ inputs.image-name }} \
            ${{ inputs.org && format('--org={0}', inputs.org) || '' }}