# ============================================================================
# Kaniko Build Template
# ============================================================================
#
# 📋 功能說明：
#   - 使用 Kaniko 在容器內建置 Docker 映像（無需 Docker daemon）
#   - 自動產生版本標籤（日期.commit）
#   - 支援 layer caching 加速建置
#   - 輸出版本號到環境檔案
#   - 支援推送至 DockerHub 或 GitHub Container Registry (GHCR)
#
# 🔧 使用方式：
#
#   📌 推送到 DockerHub（預設）：
#   jobs:
#     build:
#       uses: ./.github/workflows/build-kaniko-tpl.yml
#       with:
#         repository: "my-repo"
#         container_repository: "myorg/my-service"
#         working_directory: "services/my-service"
#         dockerfile_path: "Dockerfile"
#       secrets:
#         DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
#         DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
#
#   📌 推送到 GitHub Container Registry：
#   jobs:
#     build:
#       uses: ./.github/workflows/build-kaniko-tpl.yml
#       permissions:
#         contents: read
#         packages: write
#       with:
#         repository: "my-repo"
#         container_repository: "myorg/my-service"
#         working_directory: "services/my-service"
#         dockerfile_path: "Dockerfile"
#         registry: "ghcr"
#       secrets: inherit
#
# 📦 輸入參數：
#   - repository: 儲存庫名稱（必填）
#   - container_repository: 容器映像儲存庫路徑（必填）
#   - working_directory: 工作目錄路徑（必填）
#   - dockerfile_path: Dockerfile 相對路徑（必填）
#   - registry: 目標 registry（選填，預設：dockerhub，可選：dockerhub / ghcr）
#   - cache: 是否啟用 layer cache（選填，預設：true）
#   - cache_repository: 自訂 cache repo 路徑（選填，預設自動產生）
#   - runs_on: Runner 類型（選填，預設：["self-hosted", "linux"]）
#
# 🔐 必要 Secrets：
#   📌 DockerHub（registry: dockerhub）：
#     - DOCKERHUB_USERNAME: Docker Hub 使用者名稱
#     - DOCKERHUB_TOKEN: Docker Hub 存取權杖
#   📌 GitHub Container Registry（registry: ghcr）：
#     - 自動使用 github.token，無需額外設定 secrets
#     - 調用端需設定 permissions: packages: write
#
# ============================================================================

name: 🔧 Kaniko Build Template

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository name'
        required: true
        type: string
      container_repository:
        description: 'Container repository path (e.g. myorg/myimage)'
        required: true
        type: string
      working_directory:
        description: 'Working directory path'
        required: true
        type: string
      dockerfile_path:
        description: 'Dockerfile relative path'
        required: true
        type: string
      registry:
        description: 'Target container registry: dockerhub or ghcr'
        required: false
        type: string
        default: 'dockerhub'
      cache:
        description: 'Enable layer caching'
        required: false
        type: boolean
        default: true
      cache_repository:
        description: 'Remote cache repository path (default: auto-generated from container_repository)'
        required: false
        type: string
        default: ''
      private_registry:
        description: 'Optional private registry hostname (Harbor, jFrog, Nexus, etc.) to inject into kaniko Docker auth'
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Runner type'
        required: false
        type: string
        default: '["self-hosted", "linux"]'
      version:
        description: 'Override version tag (e.g. v1.2.3); if empty, auto-generates date.commit'
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 3
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      GHCR_TOKEN:
        required: false
      PRIVATE_REGISTRY_USERNAME:
        required: false
      PRIVATE_REGISTRY_PASSWORD:
        required: false
    outputs:
      version:
        description: 'Generated version tag (YYYY-MM-DD.commit-sha)'
        value: ${{ jobs.kaniko-build.outputs.version }}

jobs:
  kaniko-build:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # --- 1️⃣ 檢出程式碼（在 Runner 主機執行） ---
      - uses: actions/checkout@v4

      # --- 2️⃣ 設定 Docker Auth（DockerHub） ---
      - name: Configure Docker Auth (DockerHub)
        if: inputs.registry == 'dockerhub'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          DOCKER_CFG_DIR="${RUNNER_TEMP}/.docker"
          mkdir -p "${DOCKER_CFG_DIR}"
          AUTH=$(echo -n "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" | base64)
          echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${AUTH}\"}}}" > "${DOCKER_CFG_DIR}/config.json"
          echo "DOCKER_CFG_DIR=${DOCKER_CFG_DIR}" >> $GITHUB_ENV

      # --- 2️⃣ 設定 Docker Auth（GitHub Container Registry） ---
      # Prefer GHCR_TOKEN (PAT with write:packages) over GITHUB_TOKEN,
      # because GITHUB_TOKEN cannot create new org-scoped GHCR packages.
      - name: Configure Docker Auth (GHCR)
        if: inputs.registry == 'ghcr'
        env:
          GHCR_PASS: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          DOCKER_CFG_DIR="${RUNNER_TEMP}/.docker"
          mkdir -p "${DOCKER_CFG_DIR}"
          echo '{"auths":{"ghcr.io":{"auth":"'"$(echo -n ${{ github.actor }}:${GHCR_PASS} | base64)"'"}}}' > "${DOCKER_CFG_DIR}/config.json"
          echo "DOCKER_CFG_DIR=${DOCKER_CFG_DIR}" >> $GITHUB_ENV

      # --- 2️⃣.5 Inject private registry auth (Harbor, jFrog, Nexus, etc.) ---
      - name: Configure Private Registry Auth
        if: inputs.private_registry != ''
        env:
          PRIVATE_REGISTRY: ${{ inputs.private_registry }}
          PRIVATE_REGISTRY_USERNAME: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          PRIVATE_REGISTRY_PASSWORD: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
        run: |
          if [ -z "${PRIVATE_REGISTRY_USERNAME}" ] || [ -z "${PRIVATE_REGISTRY_PASSWORD}" ]; then
            echo "::warning::PRIVATE_REGISTRY_USERNAME or PRIVATE_REGISTRY_PASSWORD not set; skipping auth injection"
            exit 0
          fi
          REGISTRY_AUTH=$(echo -n "${PRIVATE_REGISTRY_USERNAME}:${PRIVATE_REGISTRY_PASSWORD}" | base64)
          jq --arg r "${PRIVATE_REGISTRY}" --arg a "${REGISTRY_AUTH}" \
             '.auths[$r] = {"auth": $a}' \
             "${DOCKER_CFG_DIR}/config.json" > /tmp/_private_registry_cfg.json \
          && mv /tmp/_private_registry_cfg.json "${DOCKER_CFG_DIR}/config.json"

      # --- 3️⃣ 計算版本號 (tag 優先，否則日期+commit) ---
      - name: Generate Version Tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(date '+%Y-%m-%d').${GITHUB_SHA::8}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "$VERSION" > version.txt
          echo "Generated version: $VERSION"

      # --- 3️⃣.5 清理舊的 Docker 映像 ---
      - name: Clean up previous Docker images
        run: |
          echo "Cleaning up dangling Docker images before build"
          docker container prune -f || true
          docker image prune -af || true

      # --- 4️⃣ 決定目標 Registry URL ---
      - name: Set Registry URL
        id: registry
        run: |
          if [ "${{ inputs.registry }}" == "ghcr" ]; then
            echo "REGISTRY_URL=ghcr.io" >> $GITHUB_ENV
          else
            echo "REGISTRY_URL=docker.io" >> $GITHUB_ENV
          fi

      # --- 4️⃣.5 計算 Cache Repository ---
      - name: Set Cache Repository
        if: inputs.cache
        run: |
          if [ -n "${{ inputs.cache_repository }}" ]; then
            echo "CACHE_REPO=${{ inputs.cache_repository }}" >> $GITHUB_ENV
          else
            echo "CACHE_REPO=${REGISTRY_URL}/${{ inputs.container_repository }}/cache" >> $GITHUB_ENV
          fi
          echo "Cache repository: ${CACHE_REPO:-disabled}"

      # --- 5️⃣ 在 Runner 主機上手動 docker run Kaniko ---
      - name: Build and Push with Kaniko
        run: |
          CACHE_ARGS=""
          if [ "${{ inputs.cache }}" == "true" ]; then
            CACHE_ARGS="--cache=true --cache-repo=${CACHE_REPO}"
          fi

          docker run --network=host \
            -v $(pwd)/${{ inputs.working_directory }}:/workspace \
            -v ${DOCKER_CFG_DIR}:/kaniko/.docker:ro \
            gcr.io/kaniko-project/executor:v1.23.0-debug \
            --context /workspace \
            --dockerfile /workspace/${{ inputs.dockerfile_path }} \
            --destination ${REGISTRY_URL}/${{ inputs.container_repository }}:${VERSION} \
            --build-arg BUILD_COMMIT_SHA=${GITHUB_SHA::8} \
            ${CACHE_ARGS} \
            --image-fs-extract-retry 5

      # --- 6️⃣ 輸出版本號 ---
      - name: Export version
        run: |
          ENV_FILE="${{ inputs.repository }}.env"
          mkdir -p "$(dirname "${ENV_FILE}")"
          echo "VERSION=${VERSION}" >> "${ENV_FILE}"
          cat "${ENV_FILE}"
