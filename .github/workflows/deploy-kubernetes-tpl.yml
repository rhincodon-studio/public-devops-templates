# ============================================================================
# Kubernetes Deploy Template
# ============================================================================
#
# 📋 功能說明：
#   - 使用 k8s-deploy 容器偵測 Git 變更中的 Helm chart
#   - 自動部署變更的 chart 到 Kubernetes
#   - 支援多叢集部署（根據路徑自動選擇 kubeconfig）
#
# 🔧 使用方式：
#
#   📌 自動偵測變更並部署：
#   jobs:
#     deploy:
#       uses: rhincodon-studio/public-devops-templates/.github/workflows/deploy-kubernetes-tpl.yml@main
#       with:
#         base_sha: ${{ github.event.before }}
#         head_sha: ${{ github.sha }}
#       secrets: inherit
#
#   📌 手動指定 chart 部署：
#   jobs:
#     deploy:
#       uses: rhincodon-studio/public-devops-templates/.github/workflows/deploy-kubernetes-tpl.yml@main
#       with:
#         charts: "deploy/my-app/helm/RKE2-TWTPH-LAB/my-app"
#       secrets: inherit
#
# 📦 輸入參數：
#   - base_sha: 比較的基準 commit SHA（選填，用於自動偵測）
#   - head_sha: 比較的目標 commit SHA（選填，用於自動偵測）
#   - charts: 要部署的 chart 路徑，空格分隔（選填，手動指定）
#   - k8s_deploy_image: k8s-deploy 容器映像（選填）
#   - kubeconfig_dir: kubeconfig 目錄（選填）
#   - helm_timeout: Helm 部署超時時間（選填）
#   - runs_on: Runner 類型（選填）
#
# 🔐 必要 Secrets：
#   - KUBECONFIG_<CLUSTER_NAME>: Base64 編碼的 kubeconfig 內容
#     例如：KUBECONFIG_RKE2_TWTPH_LAB（注意：cluster 名稱中的 - 需改為 _）
#   - 產生方式：cat ~/.kube/config | base64 -w 0
#
# ============================================================================

name: 🚀 K8s Deploy (Template)

on:
  workflow_call:
    inputs:
      base_sha:
        description: 'Base commit SHA for diff (for auto-detection)'
        required: false
        type: string
        default: ''
      head_sha:
        description: 'Head commit SHA for diff (for auto-detection)'
        required: false
        type: string
        default: ''
      charts:
        description: 'Space-separated chart paths to deploy (overrides auto-detection)'
        required: false
        type: string
        default: ''
      k8s_deploy_image:
        description: 'k8s-deploy container image'
        required: false
        type: string
        default: 'ghcr.io/rhincodon-studio/k8s-deploy:2026-01-20.227818a7'
      kubeconfig_dir:
        description: 'Directory containing kubeconfig files on runner'
        required: false
        type: string
        default: '/home/user/.kube'
      helm_timeout:
        description: 'Helm deployment timeout'
        required: false
        type: string
        default: '5m'
      runs_on:
        description: 'Runner type'
        required: false
        type: string
        default: '["self-hosted", "linux"]'
      cluster:
        description: 'Target cluster name (used to select kubeconfig secret)'
        required: false
        type: string
        default: ''

    secrets:
      KUBECONFIG_RKE2_TWTPH_LAB:
        description: 'Base64 encoded kubeconfig for RKE2-TWTPH-LAB cluster'
        required: false

    outputs:
      deployed_charts:
        description: 'List of deployed charts'
        value: ${{ jobs.deploy.outputs.deployed_charts }}

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      deployed_charts: ${{ steps.deploy.outputs.charts }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        if: contains(inputs.k8s_deploy_image, 'ghcr.io')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Setup kubeconfig from secrets
        id: kubeconfig
        run: |
          mkdir -p $HOME/.kube-temp

          # Write kubeconfig from secret (RKE2-TWTPH-LAB)
          if [ -n "${{ secrets.KUBECONFIG_RKE2_TWTPH_LAB }}" ]; then
            echo "${{ secrets.KUBECONFIG_RKE2_TWTPH_LAB }}" | base64 -d > $HOME/.kube-temp/RKE2-TWTPH-LAB
            echo "✅ Loaded kubeconfig for RKE2-TWTPH-LAB"
          fi

          # List available kubeconfigs
          echo "📂 Available kubeconfigs:"
          ls -la $HOME/.kube-temp/ || echo "No kubeconfigs found"

          echo "kubeconfig_dir=$HOME/.kube-temp" >> $GITHUB_OUTPUT

      - name: Deploy with k8s-deploy container
        id: deploy
        run: |
          # Prepare arguments
          ARGS=""

          if [ -n "${{ inputs.charts }}" ]; then
            ARGS="--charts ${{ inputs.charts }}"
            echo "charts=${{ inputs.charts }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.base_sha }}" ] && [ -n "${{ inputs.head_sha }}" ]; then
            ARGS="--base-sha ${{ inputs.base_sha }} --head-sha ${{ inputs.head_sha }}"
          else
            ARGS="--base-sha HEAD~1 --head-sha HEAD"
          fi

          ARGS="$ARGS --helm-timeout ${{ inputs.helm_timeout }}"

          echo "🚀 Running k8s-deploy container"
          echo "   Image: ${{ inputs.k8s_deploy_image }}"
          echo "   Args: $ARGS"

          # Debug: check if .git exists
          echo "📂 Checking workspace:"
          ls -la $(pwd)/ | head -10
          echo "📂 .git exists: $(test -d .git && echo 'yes' || echo 'no')"

          # Run k8s-deploy in container
          # Chart is copied to temp dir inside container, so workspace won't be modified
          # Note: workspace needs to be writable for git operations (git diff)
          # We need to configure git safe.directory inside the container before running k8s-deploy
          docker run --rm \
            -v $(pwd):/workspace \
            -v ${{ steps.kubeconfig.outputs.kubeconfig_dir }}:/root/.kube:ro \
            -e GIT_DISCOVERY_ACROSS_FILESYSTEM=1 \
            -w /workspace \
            --entrypoint /bin/sh \
            ${{ inputs.k8s_deploy_image }} \
            -c "git config --global --add safe.directory /workspace && /k8s-deploy $ARGS"

      - name: Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ inputs.k8s_deploy_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.charts }}" ]; then
            echo "### Deployed Charts:" >> $GITHUB_STEP_SUMMARY
            for chart in ${{ inputs.charts }}; do
              echo "- \`$chart\`" >> $GITHUB_STEP_SUMMARY
            done
          elif [ -n "${{ inputs.base_sha }}" ]; then
            echo "**Mode:** Auto-detect from \`${{ inputs.base_sha }}..${{ inputs.head_sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi
